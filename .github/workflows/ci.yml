name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No GPU and no display: MuJoCo physics only; the render tests skip themselves.
      - run: uv run pytest
        env:
          MUJOCO_GL: disable
