[project]
name = "jepa-as-a-tool"
version = "0.1.0"
description = "An LLM agent that queries a V-JEPA 2 world model before acting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gym-pusht>=0.1.8",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "numpy>=2.0",
    "opencv-python>=4.14.0.94",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "typer>=0.12",
]

[project.scripts]
jat = "jat.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jat"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # `ruff format` owns line length; long prompt strings stay readable

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["jat.tool.session.Budget"]  # frozen dataclass

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
