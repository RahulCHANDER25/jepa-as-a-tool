[project]
name = "jepa-as-a-tool"
version = "0.1.0"
description = "An LLM agent that queries a V-JEPA 2 world model before acting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gym-pusht>=0.1.8",
    "numpy>=2.0",
    "typer>=0.12",
]

[project.scripts]
jat = "jat.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jat"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
